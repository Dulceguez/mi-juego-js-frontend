<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Juego de Preguntas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="fondoVisual"></div>

  <h1>Juego de Preguntas y Respuestas</h1>

  <div id="lobby">
    <input id="nombreInput" placeholder="Nombre del jugador" />
    <select id="color">
      <option value="" disabled selected>Elegir color</option>
      <option value="red">Rojo</option>
      <option value="blue">Azul</option>
      <option value="green">Verde</option>
      <option value="yellow">Amarillo</option>
    </select>

    <button onclick="agregarJugador()">Agregar jugador</button>

    <ul id="listaJugadores"></ul>

    <button onclick="iniciarJuego()">Iniciar partida</button>
  </div>

  <div id="juegoContainer">
    <div id="dadoContainer">
      <img id="dadoImg" src="./img/dado1.png" alt="Dado" width="100" height="100" />
      <button id="tirarDado">🎲 Tirar dado</button>
    </div>
    <div id="tableroCompleto">
      <div id="casillaInicio" class="casillaEspecial">Largada</div>
      <div id="tablero"></div>
      <div id="casillaFin" class="casillaEspecial">Fin</div>
    </div>
    <div id="preguntaContainer" class="pregunta-container"></div>
  </div>
  
  <script src="./script.js"></script>

</body>
</html>
